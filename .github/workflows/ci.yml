name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: whoosh-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start
        run: |
          docker run -d --name whoosh -p 8000:8000 whoosh-server:ci
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' whoosh)" = healthy ] && exit 0
            sleep 1
          done
          docker logs whoosh
          exit 1

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # Real HTTP + WebSocket against the container: catches packaging
      # problems the in-process tests can't (e.g. no WS library in the image)
      - name: Smoke test
        run: |
          uv sync --locked
          uv run python scripts/smoke_test.py http://localhost:8000

      - name: Server logs
        if: always()
        run: docker logs whoosh
